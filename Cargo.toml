[package]
name = "rvariant"
version = "0.5.1"
edition = "2024"
license = "MIT"
description = "Value type, similar to Qt's QVariant"
authors = ["Roman Isaikin <romix.lab@gmail.com>"]
repository = "https://github.com/romixlab/rvariant"
exclude = ["fuzz"]

[features]
serde = ["dep:serde", "chrono/serde", "indexmap/serde"]
# The shared vendor text corpus (`tests/corpus/vendor.toml`) and its checks, for the tests of mx3 and better_erc
corpus = ["serde", "dep:toml"]

[dependencies]
serde = { version = "1", features = ["derive", "rc"], optional = true }
chrono = { version = "0.4" }
indexmap = { version = "2" }
si_dynamic = { version = "0.3", default-features = false }
strum = { version = "0.28", features = ["derive"] }
thiserror = "2"
toml = { version = "1", optional = true, default-features = false, features = ["std", "parse", "serde"] }

[dev-dependencies]
serde_json = "1"

# Applies only when rvariant is the workspace root; a consumer that takes rvariant by git must patch
# si_dynamic itself (e.g. by git tag v0.3.0).
[patch.crates-io]
si_dynamic = { path = "../si_dynamic" }

[profile.dev]
split-debuginfo = "unpacked"

[profile.deploy]
inherits = "release"
incremental = true

[package]
name = "rvariant"
version = "0.5.4"
edition = "2024"
license = "MIT"
description = "Value type, similar to Qt's QVariant"
authors = ["Roman Isaikin <romix.lab@gmail.com>"]
repository = "https://github.com/romixlab/rvariant"
exclude = ["fuzz"]

[features]
serde = ["dep:serde", "chrono/serde", "indexmap/serde"]
# The shared vendor text corpus (`tests/corpus/vendor.toml`) and its checks, for the tests of better_erc and other
# internal tools
corpus = ["serde", "dep:toml"]

[dependencies]
serde = { version = "1", features = ["derive", "rc"], optional = true }
chrono = { version = "0.4" }
indexmap = { version = "2" }
si_dynamic = { version = "0.3", default-features = false }
strum = { version = "0.28", features = ["derive"] }
thiserror = "2"
toml = { version = "1", optional = true, default-features = false, features = ["std", "parse", "serde"] }

[dev-dependencies]
serde_json = "1"

# Applies only when rvariant is the workspace root; a consumer that takes rvariant by git must patch
# si_dynamic itself (git, no tag). Kept active: si_dynamic 0.3 is not on crates.io (only 0.2.0), so this resolves it.
# For local work against the sibling checkout, swap in the path line.
[patch.crates-io]
si_dynamic = { git = "https://github.com/romixlab/si_dynamic" }
# si_dynamic = { path = "../si_dynamic" }

[profile.dev]
debug = false
split-debuginfo = "unpacked"

[profile.deploy]
inherits = "release"
incremental = true

[package]
name = "rvariant"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "Value type, similar to Qt's QVariant"
authors = ["Roman Isaikin <romix.lab@gmail.com>"]
repository = "https://github.com/romixlab/rvariant"

[features]
serde = ["dep:serde", "chrono/serde", "indexmap/serde"]

[dependencies]
serde = { version = "1", features = ["derive", "rc"], optional = true }
chrono = { version = "0.4" }
indexmap = { version = "2" }
si_dynamic = { path = "../si_dynamic", version = "0.1" }
strum = { version = "0.28", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"

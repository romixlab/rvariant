# Vendor text corpus: the contract between rvariant's `Variant::parse_vendor`, mx3's parameter normalisation and
# better_erc's value parser. Each case is a text as a vendor (Digi-Key) or a BOM writes it, the type it is read as,
# and what it must give. rvariant's `tests/vendor_corpus.rs` runs every case; with the `corpus` feature mx3 and
# better_erc load the same cases through `rvariant::corpus`.
#
# Sources: `def` names the Digi-Key parameter the text came from (distinct texts of mx3's lab database, 27 Oct 2026:
# parameter text only, nothing about parts); `source = "better_erc"` is a case of better_erc's erc_model value.rs
# tests; `source = "synthetic"` a spelling the data lacks (mojibake of other characters, fractions alone).
#
# Fields of a case:
# - `text`: the input, as written.
# - `type`: what it is read as: `si` (a quantity in `unit`), `range` (`lo` ~ `hi` in `unit`), `tolerance`,
#   `number`, `enum` (one of `variants`), `str`.
# - `unit`: the type's unit, without prefix (`Ω`, `F`, `°C`, `V/s`).
# Expected, all numbers in the unit without prefix (13.7 kΩ is 13700, 100 nF 1e-7, °C stays °C, 1 % is 0.01,
# 100 ppm/°C 1e-4), compared with a relative tolerance of 1e-9:
# - `value`: one number; `values`: a list of numbers (`7.8µH, 1.6µH`);
# - `lo`, `hi`: a range's or a tolerance's bounds; `ranges`: a list of ranges as `[lo, hi]`;
# - `selected`: the enum variant; `str`: the text of a `str`;
# - `cond`: the conditions after `@`, in order, each `[value, unit]` (`2pF @ 0V, 1MHz` has `[[0.0, "V"], [1e6, "Hz"]]`);
# - `warnings`: what was odd but still read, compared as a set: `mojibake`, `note:TEXT` (text in parentheses that is
#   no other spelling of the value: `(TJ)`), `trailing:WORDS` (words after the value: `Max`), `scalar_for_range` (one
#   value where a range was expected), `decimal_comma`, `spacing`, `lowercase_r` (`4r7`), `redundant_r` (`10kR`),
#   `separate_unit` (`4k7 Ohm`);
# - `error = true`: the text must be rejected (no unit, a different dimension, words only).
# A list whose items agree within 1 % is one value (`0.063W, 1/16W`), the fraction when one is written.

